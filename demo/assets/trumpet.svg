<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220">
  <!-- 종이 오린 느낌: 모양 바깥에 미색 종이 테두리를 둘러줌 -->
  <defs>
    <filter id="paper" x="-8%" y="-8%" width="116%" height="116%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="grow"/>
      <feFlood flood-color="#fbf3e4"/>
      <feComposite in2="grow" operator="in" result="border"/>
      <feMerge>
        <feMergeNode in="border"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#paper)">
    <!-- 아래쪽 U자 관 -->
    <path d="M120 152 L262 152 C278 152 278 176 262 176 L96 176 C74 176 74 138 96 138 L120 138"
          fill="none" stroke="#c8902f" stroke-width="12" stroke-linejoin="round"/>
    <!-- 왼쪽 튜닝 슬라이드 -->
    <path d="M70 106 C44 106 44 142 70 142 L120 142" fill="none" stroke="#e8b04a" stroke-width="11"/>
    <!-- 메인 관 -->
    <rect x="34" y="100" width="236" height="12" fill="#e8b04a"/>
    <rect x="34" y="101" width="236" height="3" fill="#ffd98a"/>
    <!-- 마우스피스 -->
    <path d="M14 98 L34 102 L34 110 L14 114 Z" fill="#d7a23f"/>
    <rect x="9" y="95" width="7" height="22" rx="2" fill="#f0c766"/>
    <!-- 벨 -->
    <path d="M262 100 C310 98 350 80 392 40 L392 172 C350 132 310 114 262 112 Z" fill="#e8b04a"/>
    <path d="M272 103 C314 100 352 84 386 54" fill="none" stroke="#ffd98a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="392" cy="106" rx="9" ry="66" fill="#c8902f"/>
    <!-- 밸브 3개 -->
    <g>
      <rect x="140" y="78" width="18" height="86" fill="#e8b04a"/>
      <rect x="137" y="70" width="24" height="10" fill="#c8902f"/>
      <rect x="145" y="52" width="8" height="18" fill="#d7a23f"/>
      <ellipse cx="149" cy="50" rx="10" ry="4" fill="#f6efe2"/>
      <rect x="143" y="84" width="4" height="72" fill="#ffd98a"/>

      <rect x="168" y="78" width="18" height="86" fill="#e8b04a"/>
      <rect x="165" y="70" width="24" height="10" fill="#c8902f"/>
      <rect x="173" y="52" width="8" height="18" fill="#d7a23f"/>
      <ellipse cx="177" cy="50" rx="10" ry="4" fill="#f6efe2"/>
      <rect x="171" y="84" width="4" height="72" fill="#ffd98a"/>

      <rect x="196" y="78" width="18" height="86" fill="#e8b04a"/>
      <rect x="193" y="70" width="24" height="10" fill="#c8902f"/>
      <rect x="201" y="52" width="8" height="18" fill="#d7a23f"/>
      <ellipse cx="205" cy="50" rx="10" ry="4" fill="#f6efe2"/>
      <rect x="199" y="84" width="4" height="72" fill="#ffd98a"/>
    </g>
  </g>
</svg>
